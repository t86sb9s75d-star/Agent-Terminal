<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rucker Park</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="wordmark">RUCKER PARK</div>
      <div class="topbar-divider"></div>
      <div class="system-line" id="system-line">Loading system state…</div>
      <div class="topbar-spacer"></div>
      <div class="topbar-clock" id="topbar-clock"></div>
    </header>

    <div class="shell-body">
      <nav class="rail">
        <button class="rail-item active" data-view="command"><span class="label">Command</span></button>
        <button class="rail-item" data-view="agents"><span class="label">Agents</span></button>
        <button class="rail-item" data-view="activity"><span class="label">Activity</span></button>
        <div class="rail-spacer"></div>
        <button class="rail-item rail-cta" id="new-agent-btn"><span class="label">+ New Agent</span></button>
      </nav>

      <main class="content">
        <section id="view-command" class="view"></section>
        <section id="view-agents" class="view hidden"></section>
        <section id="view-activity" class="view hidden"></section>
        <section id="view-agent-detail" class="view hidden"></section>
      </main>
    </div>
  </div>

  <div class="modal-overlay hidden" id="modal-overlay">
    <form class="modal" id="agent-form">
      <h3 id="modal-title">New Agent</h3>

      <label>Name
        <input type="text" name="name" required placeholder="e.g. Architect" />
      </label>

      <label>Role
        <input type="text" name="role" placeholder="e.g. System design and planning" />
      </label>

      <label>Provider
        <select name="provider" id="provider-select" required>
          <option value="anthropic">Anthropic</option>
          <option value="openai">OpenAI</option>
          <option value="custom">Custom command</option>
        </select>
      </label>

      <label id="model-field">Model
        <input type="text" name="model" placeholder="e.g. claude-sonnet-5" />
      </label>

      <label id="system-field">System prompt
        <textarea name="systemPrompt" rows="2" placeholder="Optional"></textarea>
      </label>

      <label id="task-field">Task / prompt
        <textarea name="task" rows="4" placeholder="What should this agent do?"></textarea>
      </label>

      <label id="command-field">Shell command
        <textarea name="command" rows="2" placeholder="e.g. python3 my_agent.py"></textarea>
      </label>

      <label id="tokens-field">Max tokens
        <input type="number" name="maxTokens" value="1024" min="1" />
      </label>

      <div class="modal-actions">
        <button type="button" class="btn" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
      <p class="modal-error" id="modal-error"></p>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
